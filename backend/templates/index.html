<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LyricSync</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- top bar: album art + track info + language badge -->
  <div id="top-bar" style="display:none;">
    <img id="album-art" src="" alt="Album art">
    <div id="track-info">
      <div id="song-name"></div>
      <div id="artist-name"></div>
    </div>
    <div id="lang-badge"></div>
  </div>

  <!-- state screen: login, loading, nothing playing, no lyrics -->
  <div id="state-screen">
    <div id="state-icon">🎵</div>
    <div id="state-title">Welcome to LyricSync</div>
    <div id="state-subtitle">Connect your Spotify account to see real-time translated lyrics</div>
    <a id="login-btn" href="/login">Connect with Spotify</a>
  </div>

  <!-- lyrics area: shown when lyrics are available -->
  <div id="lyrics-container" style="display:none;">
    <div id="lyrics-inner"></div>
  </div>

  <!-- bottom bar: progress bar -->
  <div id="bottom-bar" style="display:none;">
    <span id="time-current">0:00</span>
    <div id="progress-bar-container">
      <div id="progress-bar"></div>
    </div>
    <span id="time-total">0:00</span>
  </div>

  <script src="/static/app.js"></script>

</body>
</html>
