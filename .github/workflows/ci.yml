name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8, non-blocking on style, blocking on errors)
        run: |
          pip install flake8
          # Fail only on syntax errors / undefined names — keep style warnings non-blocking for now
          flake8 backend --select=E9,F63,F7,F82 --show-source --statistics

      - name: Smoke test — app imports and Flask instance loads
        working-directory: backend
        run: |
          python -c "
          import app
          assert app.app is not None, 'Flask app object not found'
          client = app.app.test_client()
          resp = client.get('/')
          assert resp.status_code == 200, f'Home route failed: {resp.status_code}'
          print('Smoke test passed: app boots and / returns 200')
          "
