name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # the storage tests run against Postgres as well as SQLite
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (flake8, non-blocking on style, blocking on errors)
        run: |
          # Fail only on syntax errors / undefined names — keep style warnings non-blocking for now
          flake8 backend --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit and route tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lyric_test
        run: pytest backend/tests/ -v
