<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LyricSync</title>
</head>

<body>

    <h1 id="song-title">Loading...</h1>
    <p id="artist-name"></p>

    <script>
        // This runs immediately when the page loads,
        // then repeats every 5 seconds
        async function fetchNowPlaying() {
            try {
                const response = await fetch('/now-playing');
                const data = await response.json();

                if (data.song) {
                    document.getElementById('song-title').textContent = data.song;
                    document.getElementById('artist-name').textContent = data.artist;
                } else {
                    document.getElementById('song-title').textContent = 'Nothing playing';
                }
            } catch (error) {
                console.error('Could not reach backend:', error);
            }
        }

        // Call it immediately, then every 5 seconds
        fetchNowPlaying();
        setInterval(fetchNowPlaying, 5000);
    </script>

</body>

</html>
