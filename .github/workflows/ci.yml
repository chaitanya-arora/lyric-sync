name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (flake8, non-blocking on style, blocking on errors)
        run: |
          # Fail only on syntax errors / undefined names — keep style warnings non-blocking for now
          flake8 backend --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit and route tests
        run: pytest backend/tests/ -v
